# Train the GraPPI binder classifier on the FULL experimental (Zenodo) set and
# evaluate on the Anthropic binder set. See README.md for the design rationale
# and for the stated limitation: the Anthropic set is used for early stopping /
# best-epoch selection, so its reported metrics are NOT a blind-test estimate.
#
# Consumed by train_exp_anthr.py. The frozen encoder and the classifier-head
# architecture mirror the published 2layers_10hdim_esm /
# 2layers_10hdim_esm_jkmean checkpoints and are NOT changed.

system:
  seed: 42            # --seed overrides
  cuda_id: 0          # default GPU; --cuda-id overrides it for one run

data:
  dist: 8                           # interface cutoff; both caches were built at 8 A
  min_nodes: 5

  train:
    # Experimental dataset: all 3,669 labeled designs, no held-out target.
    data_dir: ../GraPPI_data/exp_binder_data
    labels_csv: labels.csv
    # Cache built by exp_target_retraining/cache_graphs.py — reused unchanged.
    graph_cache: grappi_graphs_esm_8A/graphs_esm_8A.pkl
    # Base-feature cache for --mode grappi_base (cache_graphs_base.py).
    graph_cache_base: grappi_graphs_base_8A/graphs_base_8A.pkl

  test:
    # Anthropic dataset: 1,320 labeled designs, 1,189 with a released
    # designed.cif. The 131 without a structure are skipped, never scored as
    # negatives.
    data_dir: ../GraPPI_data/anthr_binder_data
    labels_csv: labels.csv
    id_column: binder_id
    target_column: target
    label_column: label
    # Extra label columns to stratify the report by (must exist in labels_csv).
    strata: [target, design_model, campaign]
    # Cache built by cache_graphs_anthr.py.
    graph_cache: grappi_graphs_esm_8A/graphs_esm_8A.pkl
    # Base-feature cache for --mode grappi_base (cache_graphs_base.py).
    graph_cache_base: grappi_graphs_base_8A/graphs_base_8A.pkl

encoder:
  # --mode grappi | grappi_base | esm  (overrides this)
  #   grappi      -> `dir`, ESM-input encoder, ESM cache
  #   grappi_base -> `base_dir`, base-feature encoder, base cache
  #   esm         -> no encoder; cached ESM columns straight into the head
  mode: grappi
  # Frozen SSL encoders; architecture is read from each checkpoint.
  dir: ../GraPPI_data/trained_data_ssl_finetune/2layers_10hdim_esm
  embedding_type: esm               # 1280-dim ESM-2 (esm2_t33_650M_UR50D)
  # GraPPI base: same 2 HGT layers / 2^10 hidden, but pretrained on the 25-dim
  # base node features instead of ESM.
  base_dir: ../GraPPI_data/trained_data_ssl_finetune/2layers_10hdim
  base_embedding_type: base
  esm_dim: 1280

# Classifier head — mirrors 2layers_10hdim_esm_jkmean
# (disc_binder_jkmean_5fold_summary.json). The ESM baseline uses this same head
# config, fed the raw 1,280-dim ESM node features instead of GNN embeddings.
head:
  pool_mode: cross_attn
  cross_attn_queries: 2
  cross_attn_heads: 4
  use_jk: true
  jk_mode: mean
  classifier_layers: 2
  ft_hdim: 256
  dropout: 0.4
  cls_grad_scale: 1.0

train:
  n_epochs: 1000
  patience: 20
  batch_size: 50
  lr: 0.0002
  weight_decay: 0.02
  clip_max_norm: 5.0
  scheduler_t0: 10
  scheduler_t_mult: 2
  scheduler_eta_min: 1.0e-6
  label_smoothing: 0.0              # hard 0/1 labels, matches the WBCE formula
  # Weighted BCE positive weight. 'global' -> N_neg/N_pos over the TRAINING
  # (experimental) set only: 3275/394 = 8.3122. Or set a fixed float.
  pos_weight: global
  select_metric: auprc              # early stopping / best epoch on the Anthropic set
  select_on: test                   # 'test' (Anthropic, documented non-blind) or 'train'

# Published classifier head, re-scored on the same Anthropic graph cache by
# score_original_head.py so all score sets share one preprocessing path.
original_head:
  dir: ../GraPPI_data/trained_data_ssl_finetune/2layers_10hdim_esm_jkmean
  summary: disc_binder_jkmean_5fold_summary.json
  template: disc_binder_jkmean_fold{fold}_best.pt
  select_key: fold_val_score        # original TRAINING validation score, not these labels
  arch_yaml: model_configs/config_disc_binder.yaml
  arch_key: disc_binder

output:
  # Per-run checkpoints, raw scores, metrics, stratified tables.
  dir: ../GraPPI_data/trained_data_ssl_finetune/2layers_10hdim_esm_exp_train_anthr_test
