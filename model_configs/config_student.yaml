training_task:
  - student       # Sequence-student knowledge distillation

# =============================================================================
# SYSTEM SETTINGS
# =============================================================================
system:
  cuda_id: 1
  seed: 42

# =============================================================================
# DATA SETTINGS
# =============================================================================
data:
  pdb_root: ../GraPPI_data/curated_db
  dist: "8"                 # Distance threshold for graph construction (8A)
  embedding_type: esm       # MUST be esm (1280) or esm480 (480) for the student
  min_nodes: 5
  split_seed: 42            # 80/20 train/val split, mirrors SSL

# =============================================================================
# STUDENT DISTILLATION SETTINGS
# =============================================================================
student:
  # --- Teacher (frozen GraPPI) ---
  # Point to an ESM-trained GraPPI SSL checkpoint. Its architecture is read from
  # ssl_edge_config.json in the same directory; the student hidden_dim is taken
  # from the teacher so the student is a drop-in replacement.
  teacher_ckpt: ../GraPPI_data/trained_data_ssl_finetune/6layers_9hdim_esm/ssl_edge_best.pt
  teacher_cache_dir: ../GraPPI_data/student_teacher_cache/
  teacher_batch_size: 20
  min_interface_edges: 5

  # --- Data caps ---
  max_residues_per_protein: 1000   # per-protein training cap (2000 total/complex)

  # --- Augmentation & caching ---
  swap_augment: true               # role-swap augmentation (caches swapped teacher targets)
  preload_cache: true              # load teacher cache into RAM (faster epochs)

  # --- Student architecture ---
  n_blocks: 3
  n_heads: 16
  dropout: 0.3
  input_dropout: 0.1               # dropout on ESM input features (regularization)
  ffn_mult: 4
  # hidden_dim is inherited from the teacher checkpoint (not set here)

  # --- Distillation loss ---
  mse_weight: 0.5
  cosine_weight: 1.0

  # --- Edge-level distillation (interface contact prediction) ---
  edge_loss_weight: 1.5       # 0 disables (embedding-only, original behavior)
  edge_negative_ratio: 1.0    # negatives sampled per positive contact
  edge_dropout: 0.1
  # edge_hidden: null         # edge head hidden dim (defaults to hidden_dim)

  # --- Training ---
  batch_size: 32
  num_workers: 4
  n_epochs: 1000
  lr: 0.0003
  weight_decay: 0.01
  clip_max_norm: 5.0
  patience: 30
  scheduler_t0: 10
  scheduler_t_mult: 2

  # --- Save directory ---
  save_dir: ../GraPPI_data/trained_data_student/
