# =============================================================================
# Student ΔG (ML / SVR) evaluation — compares the sequence student against the
# GraPPI(6L/512) SVR result and the pure-ESM SVR baseline.
# =============================================================================
training_task:
  - ml_dg_reg

system:
  cuda_id: 0
  seed: 42

# -----------------------------------------------------------------------------
# DATA — student requires ESM graphs
# -----------------------------------------------------------------------------
data:
  pdb_root: ../GraPPI_data/curated_db
  dist: "8"
  embedding_type: esm        # student consumes x[:, :1280]
  min_nodes: 5

# -----------------------------------------------------------------------------
# ENCODER / TASK (dg_reg section, reused by the ML dG module)
# -----------------------------------------------------------------------------
dg_reg:
  encoder_type: structure_student      # 'ssl' (GraPPI) or 'student' or structure_student
  pretrained_path: ../GraPPI_data/trained_data_structure_student/structure_student_1gnn_3blk_16h_esm_from_6layers_9hdim_esm/structure_student_best.pt
  batch_size: 30

  # Architecture fields are IGNORED for encoder_type=student (hidden_dim is read
  # from student_config.json). Set explicitly to match the teacher so the
  # hidden_dim computation / save-dir naming don't hit the null auto-detect path.
  num_layers: 6
  hidden_dim_power: 9        # e.g. 2^9 = 512 (matches the 6L/512 teacher)
  hgt_heads: 4
  message_style: gated_src

  use_jk: False              # student is a final-layer drop-in
  jk_mode: mean

  save_dir: ../GraPPI_data/trained_data_structure_student/

# -----------------------------------------------------------------------------
# ML HYPER-PARAMETERS (match the SVR baseline you are comparing against)
# -----------------------------------------------------------------------------
ml:
  dg_reg:
    n_jobs:              20
    rf_n_estimators:     300
    rf_max_depth:        10
    rf_min_samples_leaf: 10
    rf_max_features:     sqrt
    gbt_n_estimators:    200
    gbt_max_depth:       4
    gbt_learning_rate:   0.05
    dt_max_depth:        8
    dt_min_samples_leaf: 15
    svm_C:               10
    svm_epsilon:         0.1
