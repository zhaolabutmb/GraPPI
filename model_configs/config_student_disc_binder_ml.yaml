# =============================================================================
# Student disc_binder (ML / SVR) evaluation — measures how much of GraPPI's
# structural advantage over pure ESM the sequence student recovers on a task
# where GraPPI has a larger margin than on ΔG.
# =============================================================================
training_task:
  - ml_disc_binder

system:
  cuda_id: 1
  seed: 42

# -----------------------------------------------------------------------------
# DATA — student requires ESM graphs
# -----------------------------------------------------------------------------
data:
  pdb_root: ../GraPPI_data/curated_db
  dist: "8"
  embedding_type: esm        # student consumes x[:, :1280]
  min_nodes: 5

# -----------------------------------------------------------------------------
# ENCODER / TASK (disc_binder section)
# -----------------------------------------------------------------------------
disc_binder:
  encoder_type: student      # 'ssl' (GraPPI) or 'student'
  # NOTE: update this to the exact student dir you trained (blocks/heads must
  # match). Teacher = 3-layer / 1024-dim ESM -> teacher tag '3layers_10hdim_esm'.
  pretrained_path: ../GraPPI_data/trained_data_student/student_3blk_16h_esm_from_3layers_10hdim_esm/student_best.pt
  batch_size: 45

  # Architecture fields are IGNORED for encoder_type=student (hidden_dim is read
  # from student_config.json). Set explicitly to match the teacher so the
  # hidden_dim computation / save-dir naming don't hit the null auto-detect path.
  num_layers: 3
  hidden_dim_power: 10       # 2^9 = 512 (matches the 3L/512 teacher)
  hgt_heads: 4
  message_style: gated_src

  use_jk: False              # student is a final-layer drop-in
  jk_mode: mean

  # CV / metrics
  n_folds: 5
  cv_split_mode: global      # 'global' | 'fixed_pos'
  cls_metric: auc
  premium_threshold: 1.1

  save_dir: ../GraPPI_data/trained_data_student_finetune/

# -----------------------------------------------------------------------------
# ML HYPER-PARAMETERS (match the disc_binder SVR baseline you compare against)
# -----------------------------------------------------------------------------
ml:
  disc_binder:
    n_jobs:              20
    rf_n_estimators:     500
    rf_max_depth:        15
    rf_min_samples_leaf: 5
    rf_max_features:     sqrt
    gbt_n_estimators:    500
    gbt_max_depth:       6
    gbt_learning_rate:   0.1
    dt_max_depth:        15
    dt_min_samples_leaf: 20
    svm_C:               1     # more regularization for the large dataset
    svm_epsilon:         0.1
