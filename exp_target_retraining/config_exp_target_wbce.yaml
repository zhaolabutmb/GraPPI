# Target-aware WBCE retraining of the GraPPI binder classifier on the
# experimental (Zenodo) set. See README.md for the full design rationale.
#
# This config is consumed by train_exp_target_wbce.py. The frozen encoder and
# the classifier-head architecture mirror the published
# 2layers_10hdim_esm / 2layers_10hdim_esm_jkmean checkpoints and are NOT changed.

system:
  seed: 42            # system-level seed for the target split and CV
  cuda_id: 0          # default GPU; --cuda-id overrides it for one run

data:
  # Experimental dataset root (sibling GraPPI_data, not the code repo).
  data_dir: ../GraPPI_data/exp_binder_data
  labels_csv: labels.csv            # columns: binder_id,pdb_file,target_id,source,binder,label
  chains_csv: chains.csv            # columns: pdb_file,chains  (all "B,A": target B, binder A)
  input_pdbs: input_pdbs            # folder of extracted B/A complex PDBs
  dist: 8                           # interface distance cutoff (matches inference)
  min_nodes: 5
  # Cached graph+ESM pickle produced by cache_graphs.py (dataset-scoped & reusable).
  graph_cache: grappi_graphs_esm_8A/graphs_esm_8A.pkl

encoder:
  mode: grappi                      # --mode esm bypasses the GNN using cached ESM columns
  # Frozen SSL encoder; architecture is read from this directory's ssl_edge_config.json.
  dir: ../GraPPI_data/trained_data_ssl_finetune/2layers_10hdim_esm
  embedding_type: esm               # 1280-dim ESM-2 (esm2_t33_650M_UR50D)
  esm_dim: 1280

# Classifier head — mirrors 2layers_10hdim_esm_jkmean (disc_binder_jkmean_5fold_summary.json).
head:
  pool_mode: cross_attn
  cross_attn_queries: 2
  cross_attn_heads: 4
  use_jk: true
  jk_mode: mean
  classifier_layers: 2
  ft_hdim: 256
  dropout: 0.4
  cls_grad_scale: 1.0

split:
  # Leave-one-target-out: one fold per target (15 folds for the experimental
  # set). Each target is the validation set exactly once; all others train.
  mode: loto

train:
  n_epochs: 1000
  patience: 20
  batch_size: 50
  lr: 0.0002
  weight_decay: 0.02
  clip_max_norm: 5.0
  scheduler_t0: 10
  scheduler_t_mult: 2
  scheduler_eta_min: 1.0e-6
  label_smoothing: 0.0              # hard 0/1 labels (decision #3), matches the WBCE formula
  # Weighted BCE positive weight. 'global' -> N_neg/N_pos over all labeled rows
  # (3275/394 = 8.3122, decision #5); or set a fixed float to override.
  pos_weight: global
  select_metric: auprc              # early-stop / model selection on the held-out target's AUPRC

output:
  # Per-fold checkpoints, split JSON, per-target + raw-score CSVs, metrics.
  dir: ../GraPPI_data/trained_data_ssl_finetune/2layers_10hdim_esm_exp_target_loto_wbce
